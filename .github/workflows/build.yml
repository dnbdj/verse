name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: verse-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  fedora:
    name: Fedora (RPM + AppImage)
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git curl wget file \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel \
            openssl-devel libappindicator-gtk3-devel \
            patchelf rpm-build fuse fuse-libs desktop-file-utils \
            libxkbcommon-devel libxdo-devel nodejs npm

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build RPM and AppImage
        env:
          # linuxdeploy ships as an AppImage; unpack it instead of mounting it in the container.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --bundles rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: verse-fedora
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS (Universal DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal DMG
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: verse-macos
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
